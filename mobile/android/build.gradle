plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "ai.jarvis.assistant"
    compileSdk 34

    defaultConfig {
        applicationId "ai.jarvis.assistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.1"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.12"
        pip {
            install "fastapi"
            install "uvicorn"
            install "httpx"
            install "pydantic"
            install "python-dateutil"
            install "jinja2"
            install "python-dotenv"
        }
    }
}

dependencies {
}
