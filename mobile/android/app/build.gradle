apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace "ai.jarvis.assistant"
    compileSdk 34

    defaultConfig {
        applicationId "ai.jarvis.assistant"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.1"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        python {
            pip {
                install "fastapi"
                install "uvicorn"
                install "httpx"
                install "pydantic"
                install "python-dateutil"
                install "jinja2"
                install "python-dotenv"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }
}

chaquopy {
    defaultConfig {
        version "3.12"
        pip {
            install "fastapi"
            install "uvicorn"
            install "httpx"
            install "pydantic"
            install "python-dateutil"
            install "jinja2"
            install "python-dotenv"
        }
    }
}
