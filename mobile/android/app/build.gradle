plugins {
    id "com.android.application"
    id "com.chaquo.python"
}

android {
    namespace "ai.jarvis.assistant"
    compileSdk 34

    defaultConfig {
        applicationId "ai.jarvis.assistant"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.0.3"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        python {
            version "3.12"
            pip {
                // Pin pydantic v1 (pure Python). Pydantic v2 depends on the
                // native pydantic-core extension, which Chaquopy resolves to a
                // host (darwin) wheel that cannot load on Android.
                install "fastapi==0.115.6"
                install "uvicorn==0.32.1"
                install "httpx"
                install "pydantic==1.10.18"
                install "python-dateutil"
                install "jinja2"
                install "python-dotenv"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            python.srcDirs = ["src/main/python"]
        }
    }
}

dependencies {
}

// Stage Jarvis Python code + web UI into the Chaquopy source set so every
// build ships the app code (previously only build_apk.sh did this copy).
def repoRoot = file("${rootDir}/../..")
def stageTask = tasks.register("stageJarvisPython", Copy) {
    into("${projectDir}/src/main/python")
    from("${repoRoot}/jarvis") {
        into "jarvis"
        exclude "**/__pycache__/**"
        exclude "*.pyc"
    }
    from("${repoRoot}/web") {
        into "web"
        exclude "**/__pycache__/**"
        exclude "*.pyc"
    }
    outputs.upToDateWhen { false }
}

tasks.named("preBuild").configure { dependsOn(stageTask) }

// Chaquopy's python-source merge also reads this dir — wire it explicitly.
afterEvaluate {
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("PythonSources") }.configureEach {
        dependsOn(stageTask)
    }
}
